<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 할일</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #e5e5ea;
    --accent: #4c8df6;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989e; --line:#2c2c2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 14px 80px; }

  /* 화면이 넓으면 가운데를 기준으로 왼쪽은 달력, 오른쪽은 할 일. */
  @media (min-width: 900px) {
    .wrap { max-width: 1500px; padding: 12px 24px 80px; }
    #app {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 28px; align-items: start;
    }
    .cal-col { position: sticky; top: 12px; }
    .cal { margin-bottom: 0; padding: 14px 14px 8px; }
    .list-col > .cat-head:first-child { margin-top: 0; }
    #app > .notice { grid-column: 1 / -1; }

    /* 자리가 넓어진 만큼 달력도 키운다. */
    .cal-grid { gap: 4px; }
    .cal-grid .wd { font-size: 13px; padding-bottom: 4px; }
    .day { padding: 6px 0 8px; gap: 5px; }
    .day .n { width: 42px; height: 42px; line-height: 42px; font-size: 17px; border-radius: 50%; }
    .dots { gap: 3px; height: 8px; }
    .dots i { width: 7px; height: 7px; }
    .cal-head strong { font-size: 17px; }
    .fold { padding: 7px 26px; font-size: 14px; }
  }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 2px 14px; }
  header #dateTitle { font-size: 17px; font-weight: 700; }
  .btn.icon-only { font-size: 17px; padding: 7px 12px; line-height: 1; }
  header .spacer { flex: 1; }
  button { font: inherit; color: inherit; }
  .btn {
    border: 0; background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }

  .card { background: var(--card); border-radius: var(--radius); padding: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 11px; }

  /* 달력 */
  .cal { background: var(--card); border-radius: var(--radius); padding: 10px 10px 6px; margin-bottom: 18px; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .cal-head strong { font-size: 15px; }
  .cal-head button { border: 0; background: transparent; cursor: pointer; padding: 4px 8px; border-radius: 8px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
  .cal-grid .wd.sun { color: #e2564a; } .cal-grid .wd.sat { color: #4c8df6; }
  .day {
    border: 0; background: transparent; cursor: pointer; padding: 4px 0 6px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 10px;
  }
  .fold {
    display: block; margin: 2px auto 0; border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 12px; line-height: 1; padding: 5px 18px; border-radius: 999px;
  }
  .fold:hover { background: var(--line); color: var(--text); }
  .day .n {
    width: 30px; height: 30px; line-height: 30px; text-align: center;
    border-radius: 50%; font-size: 14px;
  }
  .day.other .n { opacity: .32; }
  .day.today .n { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-weight: 700; }
  .day.sel .n { background: var(--accent); color: #fff; font-weight: 700; box-shadow: none; }
  .dots { display: flex; gap: 2px; height: 6px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }

  /* 목록 */
  .cat-head { display: flex; align-items: center; gap: 8px; margin: 18px 2px 8px; }
  .cat-head .name { font-size: 14px; font-weight: 600; color: var(--muted); }
  .cat-head .sp { flex: 1; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .row {
    background: var(--card); border-radius: var(--radius); padding: 11px 14px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 12px;
  }
  .check {
    width: 26px; height: 26px; border-radius: 50%; flex: none; cursor: pointer;
    transition: opacity .15s;
    /* --c 는 각 줄에서 카테고리 색으로 넣어 준다. */
    border: 2px solid var(--c, var(--accent)); background: transparent; position: relative;
  }
  .check.done::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    background: var(--c, var(--accent));
  }
  .check.done::before {
    content: "✓"; position: absolute; inset: 0; color: #fff; font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; z-index: 1;
  }
  .row .body { min-width: 0; flex: 1; }
  .row .title { }
  .row.done .title { text-decoration: line-through; color: var(--muted); }
  .row .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .empty { background: var(--card); border-radius: var(--radius); padding: 14px; color: var(--muted); font-size: 13px; }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 17px; line-height: 1; padding: 4px 6px; border-radius: 8px;
  }
  .icon-btn:hover { background: var(--line); color: var(--text); }
  .icon-btn.add { color: var(--accent); font-size: 20px; font-weight: 700; }

  .notice { background: var(--card); border-radius: var(--radius); padding: 18px; line-height: 1.7; }
  .notice code { background: var(--line); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .uid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }

  /* 페이지 안에서 직접 그리는 창. 브라우저 기본 prompt 는 내장 브라우저에서 막히는 경우가 있다. */
  dialog#ask {
    border: 0; border-radius: 16px; padding: 0; width: min(360px, calc(100vw - 40px));
    background: var(--card); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog#ask::backdrop { background: rgba(0,0,0,.4); }
  #ask .head { padding: 18px 18px 6px; font-weight: 700; }
  #ask .msg { padding: 0 18px 12px; font-size: 13px; color: var(--muted); white-space: pre-line; }
  #ask .content { padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 8px; }
  #ask input {
    font: inherit; color: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg);
  }
  #ask .opt {
    text-align: left; border: 0; background: var(--bg); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; font: inherit; color: inherit;
  }
  #ask .opt:hover { background: var(--line); }
  #ask .opt.danger { color: #e2564a; }
  #ask .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 14px 14px; }
  #ask .foot button {
    border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer;
    background: var(--bg); color: var(--text); font: inherit;
  }
  #ask .foot button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  #ask label { font-size: 13px; color: var(--muted); }
  #ask select, #ask input[type=date], #ask input[type=number] {
    font: inherit; color: inherit; width: 100%; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg);
  }
  #ask .chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  #ask .chip {
    border: 0; border-radius: 8px; padding: 9px 0; cursor: pointer; font: inherit;
    background: var(--bg); color: var(--text);
  }
  #ask .chip.on { background: var(--accent); color: #fff; font-weight: 700; }
  #ask .row2 { display: flex; gap: 8px; align-items: center; }

  .row.dragging { opacity: .4; }
  .row.drop-before { box-shadow: inset 0 3px 0 var(--dropc, var(--accent)); }
  .cat-head.drop-target {
    background: color-mix(in srgb, var(--dropc, var(--accent)) 20%, transparent);
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <strong id="dateTitle"></strong>
    <span class="spacer"></span>
    <button id="settings" class="btn icon-only" title="설정" hidden>⚙︎</button>
    <button id="auth" class="btn">로그인</button>
  </header>
  <div id="app"></div>
</div>
<dialog id="ask"></dialog>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, onValue, update }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const appEl = document.getElementById("app");
const authBtn = document.getElementById("auth");
const settingsBtn = document.getElementById("settings");
const dateTitleEl = document.getElementById("dateTitle");

const cfg = window.HARU_FIREBASE || {};
if (!cfg.apiKey || cfg.apiKey.startsWith("여기에")) {
  appEl.innerHTML = `<div class="notice">
    <b>설정이 아직 비어 있습니다.</b><br>
    Firebase 콘솔 → 프로젝트 설정 → 내 앱 → 웹 앱에서 나오는 값을
    <code>firebase-config.js</code> 에 채워 넣으면 이 화면이 동작합니다.
  </div>`;
  authBtn.disabled = true;
  throw new Error("firebase config not set");
}

const fb = initializeApp(cfg);
const auth = getAuth(fb);
const db = getDatabase(fb);

let state = { categories: {}, tasks: {}, instances: {} };
let uid = null;
// 달력을 한 달로 펼칠지, 한 주로 접을지. 고른 값을 기억해 둔다.
let calExpanded = localStorage.getItem("calExpanded") !== "0";
let selected = startOfToday();
let month = new Date(selected.getFullYear(), selected.getMonth(), 1);

authBtn.addEventListener("click", () =>
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast("로그인 실패: " + e.message)));

settingsBtn.addEventListener("click", async () => {
  const user = auth.currentUser;
  const choice = await askChoice("설정", [
    { key: "who", label: `계정: ${user?.email || user?.displayName || "연결됨"}` },
    { key: "today", label: "오늘로 이동" },
    { key: "out", label: "로그아웃", danger: true }
  ]);
  if (choice === "today") {
    selected = startOfToday();
    month = new Date(selected.getFullYear(), selected.getMonth(), 1);
    render();
  } else if (choice === "out") {
    signOut(auth);
  }
});

onAuthStateChanged(auth, user => {
  if (!user) {
    authBtn.hidden = false;
    settingsBtn.hidden = true;
    dateTitleEl.textContent = "하루 할일";
    appEl.innerHTML = `<div class="notice">구글 계정으로 로그인하면 아이폰 앱에 기록한 내용이 보입니다.</div>`;
    return;
  }
  authBtn.hidden = true;
  settingsBtn.hidden = false;
  uid = user.uid;
  subscribe(user.uid);
});

function subscribe(uid) {
  appEl.innerHTML = `<div class="notice">불러오는 중…</div>`;
  onValue(ref(db, `users/${uid}`), snap => {
    const value = snap.val();
    if (!value) {
      appEl.innerHTML = `<div class="notice">
        <b>아직 올라온 자료가 없습니다.</b><br>
        아이폰 앱 → 설정에서 동기화를 켜고 앱을 한 번 열어 주세요.<br><br>
        내 UID: <span class="uid">${uid}</span><br>
        <span class="small muted">이 값을 firebase-config.js 의 HARU_OWNER_UID 와 데이터베이스 규칙에 넣습니다.</span>
      </div>`;
      return;
    }
    state = {
      categories: value.categories || {},
      tasks: value.tasks || {},
      instances: value.instances || {}
    };
    render();
  }, err => {
    appEl.innerHTML = `<div class="notice"><b>읽지 못했습니다.</b><br>${err.message}<br><br>
      데이터베이스 규칙에 이 UID 를 넣었는지 확인해 주세요.<br>
      <span class="uid">${uid}</span></div>`;
  });
}

/* ---------- 자료 정리 ---------- */
const alive = obj => Object.entries(obj || {}).filter(([, v]) => v && !v.deletedAt);

function instancesOn(dateKey) {
  return alive(state.instances)
    .filter(([, v]) => v.date === dateKey)
    .map(([id, v]) => ({ id, ...v, task: state.tasks[v.taskId] }))
    .filter(x => x.task && !x.task.deletedAt && !x.task.isArchived);
}

function doneColorsByDate() {
  const map = {};
  for (const [, v] of alive(state.instances)) {
    if (!v.isDone) continue;
    const task = state.tasks[v.taskId];
    const cat = task && state.categories[task.categoryId];
    const color = (cat && cat.colorHex) || "#4c8df6";
    const list = map[v.date] || (map[v.date] = []);
    if (!list.includes(color)) list.push(color);
  }
  return map;
}

function activeCategoriesOn(dateKey) {
  return alive(state.categories)
    .map(([id, v]) => ({ id, ...v }))
    .filter(c => !c.endDate || c.endDate >= dateKey)
    .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
}

/* ---------- 화면 ---------- */
function render() {
  const dots = doneColorsByDate();
  dateTitleEl.textContent = boardTitle(selected);
  appEl.innerHTML = `<div class="cal-col">${calendarHTML(dots)}</div>`
                  + `<div class="list-col">${listHTML()}</div>`;
  bind();
}

/// 앱과 같은 표기: 오늘이면 "9월 7일 (월, 오늘)".
function boardTitle(d) {
  const WD = ["일","월","화","수","목","금","토"];
  const base = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]}`;
  return sameDay(d, new Date()) ? `${base}, 오늘)` : `${base})`;
}

/// 연도와 월을 골라 옮기는 창.
function askMonth() {
  const thisYear = new Date().getFullYear();
  return new Promise(resolve => {
    askEl.innerHTML = `
      <div class="head">연도 · 월 이동</div>
      <div class="content row2">
        <select id="mYear">${Array.from({ length: 19 }, (_, i) => thisYear - 12 + i)
          .map(y => `<option value="${y}">${y}년</option>`).join("")}</select>
        <select id="mMonth">${Array.from({ length: 12 }, (_, i) => i + 1)
          .map(m => `<option value="${m}">${m}월</option>`).join("")}</select>
      </div>
      <div class="foot">
        <button data-cancel>취소</button>
        <button class="primary" data-ok>이동</button>
      </div>`;
    askEl.querySelector("#mYear").value = String(month.getFullYear());
    askEl.querySelector("#mMonth").value = String(month.getMonth() + 1);
    askEl.querySelector("[data-cancel]").onclick = () => closeAsk(resolve, null);
    askEl.querySelector("[data-ok]").onclick = () => closeAsk(resolve, {
      year: Number(askEl.querySelector("#mYear").value),
      month: Number(askEl.querySelector("#mMonth").value)
    });
    askEl.oncancel = e => { e.preventDefault(); closeAsk(resolve, null); };
    askEl.showModal();
  });
}

function calendarHTML(dots) {
  const wd = ["일","월","화","수","목","금","토"];
  let start, total;
  if (calExpanded) {
    const first = new Date(month.getFullYear(), month.getMonth(), 1);
    const pad = first.getDay();
    start = new Date(first); start.setDate(1 - pad);
    total = Math.ceil((pad + daysInMonth(month)) / 7) * 7;
  } else {
    // 접으면 고른 날짜가 든 한 주만 보여준다.
    start = new Date(selected); start.setDate(selected.getDate() - selected.getDay());
    total = 7;
  }
  let cells = "";
  for (let i = 0; i < total; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = ymd(d);
    const cls = [
      "day",
      calExpanded && d.getMonth() !== month.getMonth() ? "other" : "",
      sameDay(d, new Date()) ? "today" : "",
      key === ymd(selected) ? "sel" : ""
    ].join(" ");
    const colors = (dots[key] || []).slice(0, 3)
      .map(c => `<i style="background:${c}"></i>`).join("");
    cells += `<button class="${cls}" data-date="${key}">
        <span class="n">${d.getDate()}</span><span class="dots">${colors}</span></button>`;
  }
  return `<div class="cal">
    <div class="cal-head">
      <button id="monthBtn" style="border:0;background:transparent;cursor:pointer;font:inherit;color:inherit;padding:2px 4px;border-radius:8px">
        <strong>${month.getFullYear()}년 ${month.getMonth() + 1}월</strong> <span class="muted" style="font-size:11px">▾</span>
      </button>
      <span style="flex:1"></span>
      <button data-move="-1">‹</button>
      <button data-move="today">오늘</button>
      <button data-move="1">›</button>
    </div>
    <div class="cal-grid">${wd.map((w,i) =>
      `<div class="wd ${i===0?'sun':''} ${i===6?'sat':''}">${w}</div>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <button class="fold" data-fold title="${calExpanded ? "한 주만 보기" : "한 달 보기"}">
      ${calExpanded ? "⌃" : "⌄"}
    </button>
  </div>`;
}

function listHTML() {
  const key = ymd(selected);
  const rows = instancesOn(key);
  const cats = activeCategoriesOn(key);
  if (!cats.length) return `<div class="empty">카테고리가 없습니다.</div>`;
  return cats.map(cat => {
    const mine = rows
      .filter(r => r.task.categoryId === cat.id)
      .sort((a, b) => (a.isDone - b.isDone) || ((a.task.sortOrder ?? 0) - (b.task.sortOrder ?? 0)));
    const done = mine.filter(r => r.isDone).length;
    const body = mine.length
      ? mine.map(r => `<div class="row ${r.isDone ? "done" : ""}" draggable="true"
             data-task="${r.taskId}" data-row="${r.id}">
          <span class="check ${r.isDone ? "done" : ""}" data-toggle="${r.id}" title="완료 표시"
                style="--c:${cat.colorHex}"></span>
          <span class="body">
            <div class="title">${escapeHTML(r.task.title)}</div>
            <div class="meta">${[recurrenceText(r.task), r.photoCount ? `사진 ${r.photoCount}장` : ""]
              .filter(Boolean).join(" · ")}</div>
          </span>
          <button class="icon-btn" data-more="${r.id}" title="이름 바꾸기 · 삭제">⋯</button>
        </div>`).join("")
      : `<div class="empty">할 일이 없습니다</div>`;
    return `<div class="cat-head" data-cat="${cat.id}">
        <span class="name" style="color:${cat.colorHex}">${escapeHTML(cat.name)}</span>
        <span class="sp"></span>
        <span class="badge">완료 ${done}</span>
        <span class="badge">남은 ${mine.length - done}</span>
        <button class="icon-btn add" data-add="${cat.id}" title="할 일 추가">+</button>
      </div>${body}`;
  }).join("");
}

function bind() {
  appEl.querySelectorAll("[data-toggle]").forEach(el => el.addEventListener("click", async () => {
    const id = el.dataset.toggle;
    const current = state.instances[id];
    if (!current || !uid) return;
    el.style.opacity = .4;
    try {
      // 앱과 같은 규칙: 나중에 고친 쪽이 이기도록 수정 시각을 함께 올린다.
      await update(ref(db, `users/${uid}/instances/${id}`), {
        isDone: !current.isDone,
        updatedAt: Date.now()
      });
    } catch (e) {
      toast("바꾸지 못했습니다: " + e.message);
      el.style.opacity = 1;
    }
  }));
  bindDragAndDrop();
  appEl.querySelectorAll("[data-add]").forEach(el =>
    el.addEventListener("click", () => addTask(el.dataset.add)));
  appEl.querySelectorAll("[data-more]").forEach(el =>
    el.addEventListener("click", () => moreActions(el.dataset.more)));
  appEl.querySelectorAll("[data-date]").forEach(el => el.addEventListener("click", () => {
    selected = parseYMD(el.dataset.date);
    month = new Date(selected.getFullYear(), selected.getMonth(), 1);
    render();
  }));
  const monthBtn = appEl.querySelector("#monthBtn");
  if (monthBtn) monthBtn.addEventListener("click", async () => {
    const picked = await askMonth();
    if (!picked) return;
    const last = new Date(picked.year, picked.month, 0).getDate();
    selected = new Date(picked.year, picked.month - 1, Math.min(selected.getDate(), last));
    month = new Date(picked.year, picked.month - 1, 1);
    render();
  });
  appEl.querySelectorAll("[data-move]").forEach(el => el.addEventListener("click", () => {
    const v = el.dataset.move;
    if (v === "today") {
      selected = startOfToday();
    } else if (calExpanded) {
      month = new Date(month.getFullYear(), month.getMonth() + Number(v), 1);
      render();
      return;
    } else {
      // 접힌 상태에서는 주 단위로 움직인다.
      selected = new Date(selected);
      selected.setDate(selected.getDate() + Number(v) * 7);
    }
    month = new Date(selected.getFullYear(), selected.getMonth(), 1);
    render();
  }));
  const foldBtn = appEl.querySelector("[data-fold]");
  if (foldBtn) foldBtn.addEventListener("click", () => {
    calExpanded = !calExpanded;
    localStorage.setItem("calExpanded", calExpanded ? "1" : "0");
    month = new Date(selected.getFullYear(), selected.getMonth(), 1);
    render();
  });
}

/* ---------- 끌어서 옮기기 ---------- */
let dragging = null;

function bindDragAndDrop() {
  appEl.querySelectorAll(".row[data-task]").forEach(row => {
    row.addEventListener("dragstart", e => {
      dragging = row.dataset.task;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragging);
    });
    row.addEventListener("dragend", () => {
      dragging = null;
      appEl.querySelectorAll(".dragging, .drop-before, .drop-target")
        .forEach(el => el.classList.remove("dragging", "drop-before", "drop-target"));
    });
    row.addEventListener("dragover", e => {
      if (!dragging || row.dataset.task === dragging) return;
      e.preventDefault();
      // 놓일 자리 표시를 그 카테고리 색으로 그린다.
      const target = state.tasks[row.dataset.task];
      const color = target && state.categories[target.categoryId]?.colorHex;
      if (color) row.style.setProperty("--dropc", color);
      row.classList.add("drop-before");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-before"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      row.classList.remove("drop-before");
      const target = state.tasks[row.dataset.task];
      if (dragging && target) moveTask(dragging, target.categoryId, row.dataset.task);
    });
  });

  appEl.querySelectorAll("[data-cat]").forEach(head => {
    head.addEventListener("dragover", e => {
      if (!dragging) return;
      e.preventDefault();
      const color = state.categories[head.dataset.cat]?.colorHex;
      if (color) head.style.setProperty("--dropc", color);
      head.classList.add("drop-target");
    });
    head.addEventListener("dragleave", () => head.classList.remove("drop-target"));
    head.addEventListener("drop", e => {
      e.preventDefault();
      head.classList.remove("drop-target");
      if (dragging) moveTask(dragging, head.dataset.cat, null);
    });
  });
}

/// 끌어다 놓은 결과를 순서값에 반영한다.
/// 그날 보이는 항목들끼리만 번호를 다시 매겨, 안 보이는 지난 할 일의 순서는 건드리지 않는다.
async function moveTask(taskId, targetCategoryId, beforeTaskId) {
  const moved = state.tasks[taskId];
  if (!moved) return;
  const dateKey = ymd(selected);
  const rows = instancesOn(dateKey).filter(r => r.task.categoryId === targetCategoryId);
  const slots = rows.filter(r => r.taskId !== taskId).map(r => r.task.sortOrder ?? 0);

  let order = rows
    .filter(r => r.taskId !== taskId)
    .sort((a, b) => (a.task.sortOrder ?? 0) - (b.task.sortOrder ?? 0))
    .map(r => r.taskId);
  const at = beforeTaskId ? order.indexOf(beforeTaskId) : -1;
  if (at >= 0) order.splice(at, 0, taskId); else order.push(taskId);

  const base = slots.length ? Math.min(...slots) : 0;
  const paths = {};
  order.forEach((id, index) => {
    paths[`tasks/${id}/sortOrder`] = base + index;
    paths[`tasks/${id}/updatedAt`] = now();
  });
  if (moved.categoryId !== targetCategoryId) {
    paths[`tasks/${taskId}/categoryId`] = targetCategoryId;
  }
  await write(paths, "옮기지 못했습니다");
}

/* ---------- 페이지 안 대화상자 ---------- */
const askEl = document.getElementById("ask");

function closeAsk(resolve, value) {
  askEl.close();
  askEl.innerHTML = "";
  resolve(value);
}

/// 글자를 입력받는 창. 취소하면 null.
function askText(title, value = "", placeholder = "") {
  return new Promise(resolve => {
    askEl.innerHTML = `
      <div class="head">${escapeHTML(title)}</div>
      <div class="content"><input id="askInput" placeholder="${escapeHTML(placeholder)}"></div>
      <div class="foot">
        <button data-cancel>취소</button>
        <button class="primary" data-ok>확인</button>
      </div>`;
    const input = askEl.querySelector("#askInput");
    input.value = value;
    askEl.querySelector("[data-cancel]").onclick = () => closeAsk(resolve, null);
    askEl.querySelector("[data-ok]").onclick = () => closeAsk(resolve, input.value.trim());
    input.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); closeAsk(resolve, input.value.trim()); }
      if (e.key === "Escape") { e.preventDefault(); closeAsk(resolve, null); }
    };
    askEl.oncancel = e => { e.preventDefault(); closeAsk(resolve, null); };
    askEl.showModal();
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}

/// 버튼 몇 개 중 하나를 고르는 창. 취소하면 null.
function askChoice(title, options) {
  return new Promise(resolve => {
    askEl.innerHTML = `
      <div class="head">${escapeHTML(title)}</div>
      <div class="content">${options.map((o, i) =>
        `<button class="opt ${o.danger ? "danger" : ""}" data-i="${i}">${escapeHTML(o.label)}</button>`).join("")}</div>
      <div class="foot"><button data-cancel>취소</button></div>`;
    askEl.querySelectorAll("[data-i]").forEach(el =>
      el.onclick = () => closeAsk(resolve, options[Number(el.dataset.i)].key));
    askEl.querySelector("[data-cancel]").onclick = () => closeAsk(resolve, null);
    askEl.oncancel = e => { e.preventDefault(); closeAsk(resolve, null); };
    askEl.showModal();
  });
}

/// 예/아니오 창.
function askConfirm(title, message, okLabel = "확인") {
  return new Promise(resolve => {
    askEl.innerHTML = `
      <div class="head">${escapeHTML(title)}</div>
      <div class="msg">${escapeHTML(message)}</div>
      <div class="foot">
        <button data-cancel>취소</button>
        <button class="primary" data-ok>${escapeHTML(okLabel)}</button>
      </div>`;
    askEl.querySelector("[data-cancel]").onclick = () => closeAsk(resolve, false);
    askEl.querySelector("[data-ok]").onclick = () => closeAsk(resolve, true);
    askEl.oncancel = e => { e.preventDefault(); closeAsk(resolve, false); };
    askEl.showModal();
  });
}

function toast(text) {
  askEl.innerHTML = `<div class="head">알림</div><div class="msg">${escapeHTML(text)}</div>
    <div class="foot"><button class="primary" data-ok>확인</button></div>`;
  askEl.querySelector("[data-ok]").onclick = () => { askEl.close(); askEl.innerHTML = ""; };
  askEl.showModal();
}

/// 제목과 반복 규칙을 함께 정하는 창. 취소하면 null.
/// `withTitle` 이 참이면 제목 입력칸이 함께 나온다(새 할 일 만들 때).
function askTaskForm(headline, task, withTitle) {
  const WEEK = ["일","월","화","수","목","금","토"];
  return new Promise(resolve => {
    let kind = task.recurrence || "none";
    let mask = task.weekdayMask ?? 0;
    askEl.innerHTML = `
      <div class="head">${escapeHTML(headline)}</div>
      <div class="content">
        ${withTitle ? `<label>할 일</label><input id="rTitle" placeholder="할 일 입력">` : ""}
        <label>반복</label>
        <select id="rKind">
          <option value="none">반복 없음</option>
          <option value="daily">매일</option>
          <option value="weekly">요일 지정</option>
          <option value="monthly">매월 특정 일자</option>
        </select>
        <div id="rWeek" style="display:none">
          <label>요일</label>
          <div class="chips">${WEEK.map((w, i) =>
            `<button type="button" class="chip" data-w="${i}">${w}</button>`).join("")}</div>
        </div>
        <div id="rMonth" style="display:none">
          <label>매월 며칠</label>
          <input id="rDay" type="number" min="1" max="31" value="${task.monthDay || 1}">
        </div>
        <div id="rRange" style="display:none">
          <label>시작일</label>
          <input id="rStart" type="date" value="${task.startDate || ymd(selected)}">
          <label style="margin-top:8px">종료일</label>
          <div class="row2">
            <input id="rEnd" type="date" value="${task.endDate || ""}">
            <button type="button" class="opt" id="rClear" style="width:auto;padding:9px 12px">없음</button>
          </div>
        </div>
      </div>
      <div class="foot">
        <button data-cancel>취소</button>
        <button class="primary" data-ok>${withTitle ? "추가" : "저장"}</button>
      </div>`;

    const titleEl = askEl.querySelector("#rTitle");
    const kindEl = askEl.querySelector("#rKind");
    kindEl.value = kind;
    const refresh = () => {
      kind = kindEl.value;
      askEl.querySelector("#rWeek").style.display = kind === "weekly" ? "" : "none";
      askEl.querySelector("#rMonth").style.display = kind === "monthly" ? "" : "none";
      askEl.querySelector("#rRange").style.display = kind === "none" ? "none" : "";
    };
    kindEl.onchange = refresh;
    refresh();

    askEl.querySelectorAll("[data-w]").forEach(el => {
      const bit = 1 << Number(el.dataset.w);
      if (mask & bit) el.classList.add("on");
      el.onclick = () => {
        mask ^= bit;
        el.classList.toggle("on");
      };
    });
    askEl.querySelector("#rClear").onclick = () => { askEl.querySelector("#rEnd").value = ""; };

    askEl.querySelector("[data-cancel]").onclick = () => closeAsk(resolve, null);
    const submit = () => {
      const title = titleEl ? titleEl.value.trim() : null;
      if (withTitle && !title) { titleEl.focus(); return; }
      closeAsk(resolve, {
        title,
        recurrence: kind,
        weekdayMask: kind === "weekly" ? mask : 0,
        monthDay: kind === "monthly" ? Number(askEl.querySelector("#rDay").value) || 1 : 0,
        startDate: kind === "none" ? (task.startDate || ymd(selected)) : askEl.querySelector("#rStart").value,
        endDate: kind === "none" ? null : (askEl.querySelector("#rEnd").value || null)
      });
    };
    askEl.querySelector("[data-ok]").onclick = submit;
    if (titleEl) titleEl.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
    askEl.oncancel = e => { e.preventDefault(); closeAsk(resolve, null); };
    askEl.showModal();
    if (titleEl) setTimeout(() => titleEl.focus(), 30);
  });
}

/// 그 날짜에 이 할 일이 나타나는지(앱의 반복 규칙과 같은 계산).
function occursOn(task, date) {
  const key = ymd(date);
  if (task.startDate && key < task.startDate) return false;
  if (task.endDate && key > task.endDate) return false;
  switch (task.recurrence) {
    case "daily": return true;
    case "weekly": return ((task.weekdayMask ?? 0) & (1 << date.getDay())) !== 0;
    case "monthly": {
      const day = date.getDate();
      if (day === task.monthDay) return true;
      const last = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      return task.monthDay > last && day === last;
    }
    default: return key === task.startDate;
  }
}

/* ---------- 고치기 ---------- */
const now = () => Date.now();
const newID = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).toLowerCase();

async function write(paths, failMessage) {
  if (!uid) return;
  try {
    await update(ref(db, `users/${uid}`), paths);
  } catch (e) {
    toast(`${failMessage}: ${e.message}`);
  }
}

async function addTask(categoryId) {
  const category = state.categories[categoryId];
  const dateKey = ymd(selected);
  const form = await askTaskForm(
    `${(category && category.name) || "카테고리"} 에 추가`,
    { recurrence: "none", weekdayMask: 0, monthDay: selected.getDate(), startDate: dateKey },
    true
  );
  if (!form || !form.title) return;

  const taskId = newID();
  const sameCategory = alive(state.tasks).filter(([, t]) => t.categoryId === categoryId);
  const order = sameCategory.reduce((max, [, t]) => Math.max(max, (t.sortOrder ?? 0) + 1), 0);
  const task = {
    title: form.title, note: "", categoryId,
    recurrence: form.recurrence, weekdayMask: form.weekdayMask, monthDay: form.monthDay,
    startDate: form.startDate, endDate: form.endDate,
    sortOrder: order, isArchived: false,
    updatedAt: now(), deletedAt: null
  };
  const paths = { [`tasks/${taskId}`]: task };

  // 보고 있는 날짜에 해당하면 그날 기록도 함께 만든다.
  // 아니면 앱이 열릴 때 규칙에 맞는 날짜로 만들어 준다.
  const showsToday = occursOn(task, selected);
  if (showsToday) {
    paths[`instances/${newID()}`] = {
      taskId, date: dateKey, isDone: false, photoCount: 0,
      updatedAt: now(), deletedAt: null
    };
  }
  await write(paths, "추가하지 못했습니다");
  if (!showsToday) {
    toast("추가했습니다.\n이 날짜는 반복 규칙에 없어서 지금 화면에는 나오지 않습니다.");
  }
}

async function moreActions(instanceId) {
  const instance = state.instances[instanceId];
  const task = instance && state.tasks[instance.taskId];
  if (!task) return;
  const choice = await askChoice(task.title, [
    { key: "rename", label: "이름 바꾸기" },
    { key: "repeat", label: `반복 설정 (지금: ${recurrenceText(task) || "반복 없음"})` },
    { key: "day", label: "이 날에서만 지우기", danger: true },
    { key: "all", label: "할 일 통째로 지우기", danger: true }
  ]);
  if (choice === "rename") renameTask(instance.taskId, task.title);
  else if (choice === "repeat") setRecurrence(instance.taskId, task);
  else if (choice === "day") removeInstance(instanceId, task.title);
  else if (choice === "all") removeTask(instance.taskId, task.title);
}

async function renameTask(taskId, current) {
  const title = await askText("이름 바꾸기", current, "새 이름");
  if (!title || title === current) return;
  await write({ [`tasks/${taskId}/title`]: title, [`tasks/${taskId}/updatedAt`]: now() },
              "이름을 바꾸지 못했습니다");
}

async function setRecurrence(taskId, task) {
  const value = await askTaskForm("반복 설정", task, false);
  if (!value) return;
  await write({
    [`tasks/${taskId}/recurrence`]: value.recurrence,
    [`tasks/${taskId}/weekdayMask`]: value.weekdayMask,
    [`tasks/${taskId}/monthDay`]: value.monthDay,
    [`tasks/${taskId}/startDate`]: value.startDate,
    [`tasks/${taskId}/endDate`]: value.endDate,
    [`tasks/${taskId}/updatedAt`]: now()
  }, "반복을 저장하지 못했습니다");
  toast("반복을 저장했습니다.\n날짜별 항목은 앱을 열 때 만들어집니다.");
}

async function removeInstance(instanceId, title) {
  const ok = await askConfirm("이 날에서만 지우기",
    `‘${title}’ 을(를) 이 날짜에서 지웁니다.\n다른 날의 기록은 그대로 남습니다.`, "지우기");
  if (!ok) return;
  await write({ [`instances/${instanceId}/deletedAt`]: now(),
                [`instances/${instanceId}/updatedAt`]: now() }, "지우지 못했습니다");
}

async function removeTask(taskId, title) {
  const ok = await askConfirm("통째로 지우기",
    `‘${title}’ 을(를) 지난 기록까지 모두 지웁니다.\n되돌릴 수 없습니다.`, "모두 지우기");
  if (!ok) return;
  const stamp = now();
  const paths = { [`tasks/${taskId}/deletedAt`]: stamp, [`tasks/${taskId}/updatedAt`]: stamp };
  for (const [id, value] of alive(state.instances)) {
    if (value.taskId === taskId) {
      paths[`instances/${id}/deletedAt`] = stamp;
      paths[`instances/${id}/updatedAt`] = stamp;
    }
  }
  await write(paths, "지우지 못했습니다");
}

/* ---------- 잡일 ---------- */
function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysInMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
function sameDay(a, b) { return ymd(a) === ymd(b); }
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseYMD(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
const WD = ["일","월","화","수","목","금","토"];

/// 반복 규칙과 기간을 앱과 같은 문구로. 예) "매주 월·수 · 12월 20일까지"
function recurrenceText(task) {
  const rule = recurrenceRule(task);
  const period = periodText(task);
  if (!rule) return "";
  return period ? `${rule} · ${period}` : rule;
}

function recurrenceRule(task) {
  switch (task.recurrence) {
    case "daily": return "매일";
    case "weekly": {
      const days = WD.filter((_, i) => (task.weekdayMask ?? 0) & (1 << i));
      return days.length ? "매주 " + days.join("·") : "요일 미지정";
    }
    case "monthly": return task.monthDay ? `매월 ${task.monthDay}일` : "일자 미지정";
    default: return "";
  }
}

/// 시작일이 아직 오지 않았거나 종료일이 있으면 기간을 알려준다.
function periodText(task) {
  if (!task.recurrence || task.recurrence === "none") return "";
  const today = ymd(new Date());
  const startsLater = task.startDate && task.startDate > today;
  if (startsLater && task.endDate) return `${shortDay(task.startDate)}~${shortDay(task.endDate)}`;
  if (startsLater) return `${shortDay(task.startDate)}부터`;
  if (task.endDate) return `${shortDay(task.endDate)}까지`;
  return "";
}

function shortDay(key) {
  const [, m, d] = key.split("-").map(Number);
  return `${m}월 ${d}일`;
}
